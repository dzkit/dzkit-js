name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Run the tests on every Node version the package supports.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Check the data matches the pinned dzkit-spec
        run: npm run generate:check
      - run: npm run typecheck
      - run: npm test

  # Build once: the build tool (tsup) needs Node 22.18+, but the built
  # package itself runs on Node 20+.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke-test the built package on both module formats
        run: |
          node -e "const d = require('./dist/index.cjs'); if (d.ccpToRip('23115007') !== '00799999002311500797') process.exit(1)"
          node --input-type=module -e "import { amountToWords } from './dist/index.js'; if (!amountToWords(2).startsWith('deux')) process.exit(1)"
      - name: Assemble the playground
        run: node scripts/build-demo.mjs
